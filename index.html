function makeStudents(rng,code){
 const used=new Set(),arr=[];
 for(let i=0;i<20;i++){
  let nm;do{nm=pk(rng,SURN)+pk(rng,NAMES);}while(used.has(nm));used.add(nm);
  arr.push({id:i,seat:String(i+1).padStart(2,'0'),name:nm,skin:pk(rng,SKINS),hair:pk(rng,HAIRS),shirt:pk(rng,SHIRTS),
   longHair:rng()<.45,glasses:rng()<.6,mutterer:rng()<.32,hunched:rng()<.25,oddBtn:rng()<.18,
   rng:seeded(code+'-s'+i),device:null,cam:null,cheater:false,cheatFrom:-1,removed:false,flagged:false,sad:false,slowed:false,wary:false,
   progress:0,type:'steady',rate:0,act:null,actEnd:0,nextAt:0,seq:[],log:[],led:false,glint:false,bglint:false,fakeWrite:false,dumpAt:99,dumped:false,
   caughtAt:null,falseCount:0,wrongChecked:false,el:null,fill:null,cls:'',w:-1});
 }
 let g=arr.filter(s=>s.glasses).length;
 for(const s of arr){if(g>=12)break;if(!s.glasses){s.glasses=true;g++;}}
 return arr;
}

/* ---------- 라이벌 ---------- */
function planRival(pi){
 const R=G.R,P=PERIODS[pi],r=R.rng;R.inRoom+=P.add;R.ev=[];
 const diff=[1,.9,.8,.72][pi];
 for(let i=0;i<R.inRoom;i++){if(r()<R.catch*diff){const inst=r()<.45;R.ev.push({t:inst?rnd(r,8,P.dur-3):P.dur,type:'catch',inst});}}
 const nf=(r()<R.fa?1:0)+(r()<R.fa*.45?1:0);
 for(let i=0;i<nf;i++){const inst=r()<.4;R.ev.push({t:inst?rnd(r,6,P.dur-3):P.dur,type:'false',inst});}
 R.ev.sort((a,b)=>a.t-b.t);R.done=pi;
}
function rivalStep(upto,pi,quiet){
 const R=G.R;if(!R)return;const P=PERIODS[pi];
 while(R.ev.length&&R.ev[0].t<=upto){
  const e=R.ev.shift();let d,label;
  if(e.type==='catch'){R.combo++;const m=Math.min(2,1+.25*(R.combo-1));d=e.inst?Math.round(150*m)+Math.round((P.dur-e.t)*2):Math.round(100*m);R.caught++;R.inRoom--;label=e.inst?'현장 적발':'적발';}
  else{R.combo=0;d=e.inst?-80:-60;R.falses++;label='오인 확인';}
  R.score+=d;if(!quiet)flashRival(`${R.short} ${label} ${d>0?'+':''}${d}`);
 }
}
function rivalEndPeriod(pi,quiet){const R=G.R;if(!R||R.ended>=pi)return;rivalStep(Infinity,pi,quiet);R.score-=40*R.inRoom;R.ended=pi;}
function finishRival(){
 const R=G.R;if(!R)return;
 if(R.done>=0)rivalEndPeriod(R.done,true);
 for(let i=R.done+1;i<PERIODS.length;i++){planRival(i);rivalEndPeriod(i,true);}
}
function flashRival(txt){const el=$('#vsRival');el.textContent=txt;el.classList.add('flash');sfx('rival');clearTimeout(rivalFlashT);rivalFlashT=setTimeout(()=>{el.classList.remove('flash');updateVs();},1800);}
function updateVs(){
 $('#vsCombo').textContent=G&&G.combo>=1?`연속 적발 ${G.combo} · 다음 x${nextMult()}`:'';
 if(!G)return;
 if(G.mode==='duel'){$('#vsMe').innerHTML=`<b>${esc(G.pname)}</b> 차례`;if(!$('#vsRival').classList.contains('flash'))$('#vsRival').textContent='상대 점수는 끝나고 공개';}
 else{$('#vsMe').innerHTML=`나 <b>${G.score}</b>`;if(!$('#vsRival').classList.contains('flash'))$('#vsRival').innerHTML=G.R?`${G.R.short} <b>${G.R.score}</b>`:(G.mode==='normal'?'일반 모드':`도전 코드 ${G.code}`);}
}
function nextMult(){return Math.min(2,1+.25*G.combo);} // 이번 적발에 적용될 배수

/* ---------- 교시 진행 ---------- */
function startPeriod(){
 const P=PERIODS[G.p];G.t=0;G.checks=2;
 G.plog={caught:[],instant:[],falses:[],wrong:[],missed:0,victims:0,delta:0};
 for(const s of G.students){
  if(s.removed)continue;const r=s.rng;
  Object.assign(s,{progress:0,flagged:false,act:null,seq:[],log:[],led:false,glint:false,bglint:false,sad:false,slowed:false,wary:false,dumped:false});
  s.type=r()<.3?'dumper':'steady';s.rate=rnd(r,.75,1)*P.q/P.dur;s.dumpAt=P.dur-rnd(r,6,14);s.nextAt=rnd(r,.5,4);s.fakeWrite=r()<.35;
 }
 const pool=shuf(G.rng,G.students.filter(s=>!s.cheater));
 let nB=P.btn,nG=P.add-P.btn;
 for(const s of pool){
  if(nB<=0&&nG<=0)break;
  if(nB>0){s.cheater=true;s.device='button';s.cam=P.cam;s.oddBtn=false;s.cheatFrom=G.p;nB--;G.totalCheaters++;refreshFig(s);continue;}
  if(P.tech==='lens'||s.glasses){s.cheater=true;s.device='glasses';s.cheatFrom=G.p;nG--;G.totalCheaters++;}
 }
 if(G.R)planRival(G.p);
 $('#hPer').textContent=P.name;$('#hSubj').textContent=P.subj;
 const items=['※ 아래 속보는 모두 가상입니다',...P.ticker].join('   ·   ');
 $('#ticker').innerHTML=`<span style="animation-duration:${Math.max(22,items.length*.2)}s">${items}</span>`;
 updateHud();updateVs();
 G.lastSec=99;AU.state='exam';AU.fast=false;sfx('bell','start');
 G.running=true;last=0;raf=requestAnimationFrame(loop);
}
function loop(ts){
 if(!G.running)return;
 const dt=last?Math.min(.1,(ts-last)/1000):0;last=ts;
 update(dt);render();
 if(G.t>=PERIODS[G.p].dur){endPeriod();return;}
 raf=requestAnimationFrame(loop);
}
function addLog(s,t,text,hot){s.log.unshift({t,text,hot:!!hot});if(s.log.length>6)s.log.pop();}
function honestPick(s,P){
 const r=s.rng,pool=[['scratch',2],['yawn',1.1],['stretch',.8],['think',2],['rub',1],['earh',.6],['hunch',s.hunched?2.4:.3]];
 if(s.glasses)pool.push(['push',2.3]);
 if(s.mutterer)pool.push(['mutter',2.6]);
 if(P.tech==='lens')pool.push(['blinkh',1.8]);
 return wpk(r,pool);
}
function cheatSeq(s,P){
 if(s.device==='button')return['lean','ear','burst'];
 if(P.tech==='led'||P.tech==='slim')return['touch','mumble','burst'];
 if(P.tech==='bone')return['touch','stare','burst'];
 return['blinkc','stare','burst'];
}
function startAct(s,name,P,t0){
 const a=ACT[name];s.act=name;s.actEnd=t0+a.dur*rnd(s.rng,.85,1.15);
 if(a.log)addLog(s,t0,a.log);
 if(s.cheater&&s.device==='glasses'&&P.tech==='led'&&(name==='touch'||name==='mumble'))s.led=true;
 if(s.cheater&&s.device==='glasses'&&P.tech==='lens'&&(name==='blinkc'||name==='stare'))s.glint=true;
 if(s.cheater&&s.device==='button'&&name==='lean')s.bglint=true;
}
function endAct(s,P){
 const name=s.act,t0=s.actEnd,r=s.rng;s.act=null;s.led=false;s.glint=false;s.bglint=false;
 if(name==='burst'){const n=Math.min(Math.max(2,Math.round(P.q*rnd(r,.08,.13))),Math.floor(P.q-s.progress));if(n>0){s.progress+=n;addLog(s,t0,`OMR 연속 마킹 +${n}문항`,true);}}
 if(name==='dump'){const n=Math.max(0,Math.round(P.q*rnd(r,.82,.98)-s.progress));if(n>0){s.progress+=n;addLog(s,t0,`OMR 연속 마킹 +${n}문항`,true);}s.dumped=true;}
 const gap=s.seq.length?rnd(r,.1,.35):(s.cheater?rnd(r,3.2,6.5)*(s.wary?1.7:1):rnd(r,2.5,7));
 s.nextAt=t0+gap;
}
function nextAct(s,P){
 const t0=s.nextAt,r=s.rng;
 if(s.cheater){
  if(!s.seq.length){
   if(s.progress>=P.q-1){s.nextAt=t0+rnd(r,3,6);return;}
   if(r()<.2){startAct(s,honestPick(s,P),P,t0);return;}
   s.seq=cheatSeq(s,P);s.fakeWrite=r()<.35;
  }
  startAct(s,s.seq.shift(),P,t0);
 }else{
  if(s.type==='dumper'&&!s.dumped&&t0>=s.dumpAt){startAct(s,'dump',P,t0);return;}
  if(r()<.3){s.nextAt=t0+rnd(r,2,5);return;}
  startAct(s,honestPick(s,P),P,t0);
 }
}
function update(dt){
 const P=PERIODS[G.p];G.t+=dt;
 rivalStep(G.t,G.p);
 for(const s of G.students){
  if(s.removed)continue;
  for(let guard=0;guard<8;guard++){
   if(s.act){if(G.t>=s.actEnd)endAct(s,P);else break;}
   else{if(G.t>=s.nextAt)nextAct(s,P);else break;}
  }
  let rr=s.cheater?.06*P.q/P.dur:(s.type==='steady'?s.rate:s.rate*.22);
  if(s.slowed)rr*=.4;
  if(!s.act||s.act==='think')s.progress=Math.min(P.q,s.progress+rr*dt);
 }
}

/* ---------- 화면 ---------- */
function stateClass(s){
 if(s.removed)return ' removed';
 let c='';
 if(s.act)c+=' '+ACT[s.act].cls;
 else if(s.cheater?s.fakeWrite:!(s.type==='dumper'&&s.dumped))c+=' writing';
 if(s.led)c+=' led-on';if(s.glint)c+=' glint-on';if(s.bglint)c+=' bglint-on';if(s.sad)c+=' sad';if(s.flagged)c+=' flagged';
 return c;
}

  if(w!==s.w){s.fill.style.width=w+'%';s.w=w;}
 }

 const tm=$('#timer');tm.textContent=`${Math.floor(sec/60)}:${String(sec%60).padStart(2,'0')}`;
 tm.classList.toggle('low',left<10&&G.running);
 if(G.running){AU.fast=left<10;if(left<=10&&sec!==G.lastSec&&sec>0){G.lastSec=sec;sfx('tick',sec<=3);}}
 if(G.sel){sheetTick++;if(sheetTick%6===0)renderSheet();}
}

function vib(p){try{navigator.vibrate&&navigator.vibrate(p);}catch(e){}}
let toastT=0;
function toast(msg,kind){const t=$('#toast');t.textContent=msg;t.className='show '+(kind||'');clearTimeout(toastT);toastT=setTimeout(()=>t.className='',2800);}

function instantCheck(kind){
 const s=G.sel;if(!s||s.removed||G.checks<=0||!G.running)return;
 const P=PERIODS[G.p];G.checks--;
 const rightKind=(kind==='body')===(s.device==='button');
 if(s.cheater&&rightKind){
  const m=nextMult();G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const bonus=Math.round((P.dur-G.t)*2),pts=Math.round(150*m)+bonus;
  s.removed=true;s.flagged=false;s.caughtAt={p:G.p,how:'현장'};G.caught++;G.score+=pts;G.plog.delta+=pts;G.plog.instant.push(s);
  const what=s.device==='button'?'교복 단추':(P.tech==='lens'?'렌즈':'안경');
  toast(`적발했습니다. ${s.name} 학생의 ${what}에서 카메라가 나왔습니다. +${pts}점${m>1?` (x${m})`:''}`,'good');vib(80);sfx('catch',G.combo);
 }else if(s.cheater){
  s.wary=true;s.wrongChecked=true;G.combo=0;G.complaints+=1;G.score-=30;G.plog.delta-=30;G.wrongTotal++;G.plog.wrong.push(s);
  toast(`${kind==='body'?'복장':'안경'}에서는 아무것도 나오지 않았습니다. ${s.name} 학생이 묘하게 안도하는 표정입니다. (민원 +1)`,'bad');vib([30,40,30]);sfx('wrong');
 }else{
  s.sad=true;s.slowed=true;s.falseCount++;G.combo=0;G.complaints+=2;G.score-=80;G.plog.delta-=80;G.falseTotal++;G.plog.falses.push({s,instant:true});
  const what=kind==='body'?'평범한 교복이었습니다':(P.tech==='lens'?'그냥 눈이었습니다':(s.glasses?'그냥 안경이었습니다':'안경도 안 쓴 학생이었습니다'));
  toast(`${what}. 시험 도중 불려 나간 ${s.name} 학생이 울먹이고, 민원이 2건 들어왔습니다.`,'bad');vib([40,60,40]);sfx('buzz');
 }
 updateHud();renderSheet();render();
 if(G.complaints>=6){
  G.running=false;cancelAnimationFrame(raf);AU.state='menu';AU.fast=false;setTimeout(()=>sfx('over'),500);
  G.plog.missed=G.students.filter(x=>x.cheater&&!x.removed).length;pushHist(true);
  setTimeout(()=>{closeSheet();showFinal(true);},1400);
 }
}
const quoteFor=s=>{const l=s.log[0]?s.log[0].text:'';for(const [k,q] of QUOTES)if(l.includes(k))return q;return '"저 아무것도 안 했는데요…"';};

function endPeriod(){
 G.running=false;cancelAnimationFrame(raf);closeSheet();AU.state='menu';AU.fast=false;sfx('bell','end');
 const L=G.plog;
 for(const s of G.students){
  if(s.removed)continue;
  if(s.flagged){
   if(s.cheater){const m=nextMult();G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);const pts=Math.round(100*m);
    s.removed=true;s.caughtAt={p:G.p,how:'종료 후'};G.caught++;G.score+=pts;L.delta+=pts;L.caught.push({s,pts});}
   else{s.falseCount++;G.combo=0;G.complaints+=1;G.score-=60;L.delta-=60;G.falseTotal++;L.falses.push({s,instant:false});s.sad=true;}
   s.flagged=false;
  }else if(s.cheater){
   L.missed++;const v=1+Math.floor(Math.random()*3);L.victims+=v;G.victims+=v;G.score-=40;L.delta-=40;
  }
 }
 if(G.R)rivalEndPeriod(G.p);
 pushHist(false);
 render();updateHud();
 if(G.complaints>=6){showReport(true);return;}
 showReport(false);
}
function pushHist(partial){
 const P=PERIODS[G.p],L=G.plog;
 G.hist.push({name:P.name,subj:P.subj,caught:L.instant.length+L.caught.length,falses:L.falses.length,wrong:L.wrong.length,missed:L.missed,victims:L.victims,delta:L.delta,partial});
}

 b:{skin:'#f6d2b4',hair:'#1f1a17',shirt:'#5c4d7d',longHair:true,glasses:false,device:'button',cam:{fill:'#3a3a3a',r:1.45,dot:.5}},

function gradeOf(gameover,score){
 if(gameover)return['중단','감독관 교체','의심만으로 정직한 학생들을 붙잡았다가 민원이 쏟아졌습니다. 부정행위를 가려내는 일이 왜 감독관 한 사람의 눈에 다 맡겨져 있는지는 끝내 아무도 설명하지 않았습니다.'];
 if(score>=1300)return['S','매의 눈','안경다리 두께와 단추 색만 보고 기종을 맞히는 경지입니다. 교육부가 탐지기 대신 당신을 복제하려 들지도 모르겠습니다.'];
 if(score>=900)return['A','베테랑 감독관','장비 하나 없이 이 정도면 할 수 있는 건 다 한 셈입니다. 그래도 몇 명은 빠져나갔습니다.'];
 if(score>=500)return['B','평범한 감독관','열심히 봤지만 기술이 바뀌는 속도를 눈으로 따라가기엔 벅찼습니다.'];
 if(score>=150)return['C','졸린 감독관','오늘 시험실에서 가장 바빴던 건 감독관이 아니라 안경과 단추였습니다.'];
 return['F','글래스노바 감사패 수상','올해 판매 실적에 크게 기여해 주셔서 감사하다는 연락이 왔습니다.'];
}
const deviceLabel=s=>s.device==='button'?'카메라 단추':'AI 안경';
function showFinal(gameover){
 if(G.finalCache){modal(G.finalCache.html,G.finalCache.btns);bindFinal();return;}
 const [g,title,desc]=gradeOf(gameover,G.score);
 const left=G.students.filter(s=>s.cheater&&!s.removed).length;
 const rate=G.totalCheaters?Math.round(G.caught/G.totalCheaters*100):0;
 const now=new Date(),stamp=`${now.getMonth()+1}/${now.getDate()} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
 finishRival();
 const R=G.R;let vsLine='',vsText='';
 if(R){const win=G.score>R.score,tie=G.score===R.score;
  vsLine=`<div class="vsres ${tie?'':win?'win':'lose'}"><div class="h">${tie?'무승부':win?'승리':'패배'} · 나 ${G.score} vs ${esc(R.short)} ${R.score}</div>${esc(R.name)}은 ${R.caught}명을 잡고 ${R.falses}명을 오인했습니다.${gameover&&!win?' 당신이 교체된 뒤에도 옆 시험실 감독은 끝까지 이어졌습니다.':''}</div>`;
  vsText=`\n라이벌 ${R.name}: ${R.score}점 → ${tie?'무승부':win?'승리':'패배'}`;}

 // 이 기기 기록
 let hist=[],best=-Infinity;
 try{hist=JSON.parse(localStorage.getItem('sn_glass_hist')||'[]');}catch(e){hist=[];}
 hist.forEach(h=>{if(!h.gameover)best=Math.max(best,h.score);});
 const isBest=!gameover&&best!==-Infinity&&G.score>best;
 const vsShort=R?(G.score>R.score?' · 승':G.score<R.score?' · 패':' · 무'):'';
 hist.unshift({d:stamp,score:G.score,title,caught:G.caught,total:G.totalCheaters,gameover:!!gameover,code:G.code,who:G.mode==='duel'?G.pname:'',vs:vsShort});
 hist=hist.slice(0,8);
 try{localStorage.setItem('sn_glass_hist',JSON.stringify(hist));}catch(e){}

 let rows='',tc=0,tf=0,td=0;
 G.hist.forEach(h=>{tc+=h.caught;tf+=h.falses+h.wrong;td+=h.delta;
  rows+=`<tr><td class="l">${h.name} ${h.subj.replace(' 영역','')}${h.partial?' <span class="ng">(중단)</span>':''}</td><td class="ok">${h.caught}</td><td class="ng">${h.falses+h.wrong}</td><td>${h.missed}</td><td>${h.delta>=0?'+':''}${h.delta}</td></tr>`;});
 for(let i=G.hist.length;i<PERIODS.length;i++)rows+=`<tr><td class="l mu">${PERIODS[i].name} ${PERIODS[i].subj.replace(' 영역','')}</td><td class="mu" colspan="4">감독 못 함</td></tr>`;
 rows+=`<tr class="tot"><td class="l">합계</td><td>${tc}</td><td>${tf}</td><td>${left}</td><td>${td>=0?'+':''}${td}</td></tr>`;

 let roster='';
 G.students.forEach(s=>{
  let real,res,cls='';

   real=`${deviceLabel(s)} <span class="mu">(${PERIODS[s.cheatFrom].name}~)</span>`;
   if(s.caughtAt){res=`<span class="ok">${PERIODS[s.caughtAt.p].name} ${s.caughtAt.how} 적발</span>`;cls='ch';}
   else{res=`<span class="ng">끝까지 못 잡음${s.wrongChecked?' (헛짚음)':''}</span>`;cls='miss';}
  }else{
   real=`<span class="mu">정직${s.oddBtn?' · 단추 하나 교체함':''}</span>`;
   res=s.falseCount?`<span class="ng">오인 확인 ${s.falseCount}회</span>`:'<span class="mu">-</span>';
  }

/* ---------- 소리: 외부 파일 없이 브라우저에서 합성 ---------- */
const AU={ctx:null,master:null,mus:null,sfx:null,noiseBuf:null,vol:{music:45,sfx:70,mute:false},state:'menu',fast:false,step:0,nextT:0,timer:0};
try{const v=JSON.parse(localStorage.getItem('sn_glass_vol')||'null');if(v)Object.assign(AU.vol,v);}catch(e){}
const saveVol=()=>{try{localStorage.setItem('sn_glass_vol',JSON.stringify(AU.vol));}catch(e){}};
const mtof=m=>440*Math.pow(2,(m-69)/12);
function auInit(){
 if(AU.ctx){if(AU.ctx.state==='suspended'&&!document.hidden)AU.ctx.resume().catch(()=>{});return;}
 const C=window.AudioContext||window.webkitAudioContext;if(!C)return;
 try{AU.ctx=new C();}catch(e){AU.ctx=null;return;}
 const c=AU.ctx;
 AU.master=c.createGain();AU.master.gain.value=.9;
 const comp=c.createDynamicsCompressor();AU.master.connect(comp);comp.connect(c.destination);
 AU.mus=c.createGain();AU.sfx=c.createGain();AU.mus.gain.value=0;AU.sfx.gain.value=0;AU.mus.connect(AU.master);AU.sfx.connect(AU.master);
 const len=Math.floor(c.sampleRate*.5),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;AU.noiseBuf=b;
 auApply();AU.nextT=c.currentTime+.2;AU.timer=setInterval(auSchedule,40);
 if(c.state==='suspended')c.resume().catch(()=>{});
}
['pointerdown','touchend','keydown'].forEach(ev=>document.addEventListener(ev,auInit,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend().catch(()=>{});else AU.ctx.resume().catch(()=>{});});
function auApply(){if(!AU.ctx)return;const t=AU.ctx.currentTime,m=AU.vol.mute?0:1;AU.mus.gain.setTargetAtTime(AU.vol.music/100*.55*m,t,.08);AU.sfx.gain.setTargetAtTime(AU.vol.sfx/100*m,t,.03);}
function tone(dest,f,t,dur,o={}){
 const c=AU.ctx,os=c.createOscillator(),g=c.createGain();
 os.type=o.type||'sine';os.frequency.setValueAtTime(f,t);if(o.to)os.frequency.exponentialRampToValueAtTime(o.to,t+dur);
 const v=o.vol==null?.2:o.vol,a=o.a||.005;
 g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+Math.max(dur,a+.01));
 os.connect(g);
 if(o.lp){const fl=c.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.lp;g.connect(fl);fl.connect(dest);}else g.connect(dest);
 os.start(t);os.stop(t+dur+.05);
}
function noise(dest,t,dur,vol,type,freq){
 const c=AU.ctx,src=c.createBufferSource(),fl=c.createBiquadFilter(),g=c.createGain();
 src.buffer=AU.noiseBuf;fl.type=type||'highpass';fl.frequency.value=freq||6000;
 g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 src.connect(fl);fl.connect(g);g.connect(dest);src.start(t);src.stop(t+dur+.02);
}
/* 시험 중: A단조 긴장감 있는 루프 + 시계 초침 / 메뉴: 느린 패드 */
const EXAM=[[45,57,60,64],[41,53,57,60],[38,50,53,57],[40,52,56,59]];
const MENU=[[45,57,60,64],[41,53,57,60],[48,55,60,64],[43,55,59,62]];
function auSchedule(){
 const c=AU.ctx;if(!c||c.state!=='running')return;
 if(AU.nextT<c.currentTime-.3)AU.nextT=c.currentTime+.05;
 const exam=AU.state==='exam',bpm=exam?(AU.fast?138:108):74,sp=60/bpm/4;
 while(AU.nextT<c.currentTime+.15){
  if(AU.vol.music>0&&!AU.vol.mute&&AU.state!=='intro'){try{musStep(AU.step,AU.nextT,sp,exam);}catch(e){}}
  AU.nextT+=sp;AU.step=(AU.step+1)%64;
 }
}
function musStep(s,t,sp,exam){
 const bar=Math.floor(s/16),i=s%16,ch=(exam?EXAM:MENU)[bar],M=AU.mus;
 if(exam){
  if(i===0||i===3||i===6||i===8||i===11||i===14)tone(M,mtof(ch[0]),t,sp*2.2,{type:'triangle',vol:.34,lp:650});
  if(i%2===0)tone(M,mtof(ch[1+((i/2)%3)]+12),t,sp*1.6,{type:'square',vol:.03,lp:2200});
  if(i%4===0)tone(M,1900,t,.025,{vol:.05});
  if(i%4===2)noise(M,t,.03,.05,'highpass',7000);
  if(AU.fast&&i%2===1)noise(M,t,.02,.045,'highpass',9000);
 }else{
  if(i===0){ch.slice(1).forEach(n=>tone(M,mtof(n),t,sp*16,{vol:.045,a:.5}));tone(M,mtof(ch[0]),t,sp*15,{type:'triangle',vol:.12,a:.1,lp:500});}
  if(i%4===0||i===10)tone(M,mtof(ch[1+((i/2|0)%3)]+12),t,sp*3,{type:'triangle',vol:.05,lp:3000});
 }
}
const aNow=()=>AU.ctx.currentTime+.01;
const SFX={
 click(){tone(AU.sfx,660,aNow(),.05,{type:'triangle',vol:.1});},
 select(){tone(AU.sfx,1040,aNow(),.035,{vol:.09});},
 flag(){const t=aNow();noise(AU.sfx,t,.06,.14,'bandpass',2500);tone(AU.sfx,520,t+.02,.08,{type:'triangle',vol:.14});},
 catch(n){const t=aNow(),b=72+Math.min(n||0,7);[0,4,7,12].forEach((k,j)=>tone(AU.sfx,mtof(b+k),t+j*.06,.22,{type:'square',vol:.08,lp:3500}));tone(AU.sfx,mtof(b+19),t+.24,.45,{vol:.12});},
 wrong(){const t=aNow();tone(AU.sfx,210,t,.26,{vol:.35,to:90});noise(AU.sfx,t,.12,.12,'lowpass',800);},
 buzz(){const t=aNow();tone(AU.sfx,150,t,.42,{type:'sawtooth',vol:.13,to:110,lp:1400});tone(AU.sfx,156,t,.42,{type:'square',vol:.05,to:112,lp:1000});},
 rival(){const t=aNow();tone(AU.sfx,700,t,.08,{vol:.07});tone(AU.sfx,940,t+.07,.1,{vol:.06});},
 tick(hi){tone(AU.sfx,hi?1800:1300,aNow(),.05,{type:'square',vol:.05,lp:4000});},
 bell(kind){const t=aNow(),ns=kind==='end'?[67,74,76,72]:[76,72,74,67];
  ns.forEach((n,j)=>{tone(AU.sfx,mtof(n),t+j*.42,1.5,{vol:.16,a:.01});tone(AU.sfx,mtof(n)*2.76,t+j*.42,.5,{vol:.03});});},
 over(){const t=aNow();[67,63,60,55].forEach((n,j)=>tone(AU.sfx,mtof(n),t+j*.24,.4,{type:'triangle',vol:.16,lp:2000}));},
 result(good){const t=aNow(),ns=good?[72,76,79,84]:[69,72,76,74];ns.forEach((n,j)=>tone(AU.sfx,mtof(n),t+j*.13,j===3?.8:.25,{type:good?'square':'triangle',vol:good?.07:.12,lp:3000}));}
};
function sfx(name,arg){if(!AU.ctx||AU.ctx.state!=='running'||AU.vol.mute||AU.vol.sfx<=0)return;try{SFX[name](arg);}catch(e){}}
function sndUI(){

$('#sndBtn').onclick=e=>{e.stopPropagation();auInit();toggleSnd();};

const FONT='-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif';
function ctext(x,t,X,Y,size,color,weight,align,maxW){
 let s=size;x.font=`${weight||700} ${s}px ${FONT}`;
 if(maxW){while(s>16&&x.measureText(t).width>maxW){s-=2;x.font=`${weight||700} ${s}px ${FONT}`;}}
 x.fillStyle=color;x.textAlign=align||'left';x.textBaseline='alphabetic';x.fillText(t,X,Y);
}
function rr(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}

 x.beginPath();x.moveTo(-16,-6);x.quadraticCurveTo(0,-16,16,-6);x.stroke();
 x.fillStyle='#ff3b3b';x.beginPath();x.arc(92,-36,11,0,Math.PI*2);x.fill();x.restore();
 return {cv,x,W,H};
}

  x.save();x.translate(X+230,Y+190);x.strokeStyle='#c8322b';x.lineWidth=8;x.beginPath();x.arc(0,0,74,0,Math.PI*2);x.stroke();
  if(p.grade.length>1)ctext(x,p.grade,0,18,52,'#c8322b',900,'center');else ctext(x,p.grade,0,34,96,'#c8322b',900,'center');x.restore();
  ctext(x,p.score+'점',X+230,Y+340,70,'#2a2620',900,'center',420);
  [['적발',`${p.caught}/${p.total}명`],['오인·헛짚음',`${p.falses}회`],['최대 연속',`${p.combo}`],['민원',`${p.complaints}건`]].forEach(([l,v],j)=>{
   const yy=Y+400+j*40;ctext(x,l,X+50,yy,28,'#8a7860',700);ctext(x,v,X+410,yy,30,'#2a2620',800,'right');});
  if(isW)ctext(x,'WIN',X+400,Y+56,30,'#2e8b4e',900,'right');});
 ctext(x,'이 코드로 다른 친구도 같은 시험실에 도전할 수 있습니다',W/2,1180,30,'#5a4a33',700,'center',940);
 const d=new Date();cardFooter(x,W,H,code,`${d.getFullYear()}.${d.getMonth()+1}.${d.getDate()} · 같은 코드 대결`);
 return cv.toDataURL('image/png');

function dataToFile(url,name){const [h,b]=url.split(',');const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new File([u],name,{type:'image/png'});}
function showCard(url,back){
 const fname='안경좀벗어볼까요-결과.png';
 const btns=[{label:'이미지 저장',keep:true,fn:el=>{
   try{const a=document.createElement('a');a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();el.textContent='저장을 요청했습니다';}
   catch(e){el.textContent='길게 눌러 저장하세요';}
   setTimeout(()=>el.textContent='이미지 저장',2200);}}];

 if(canShare)btns.push({label:'공유하기',keep:true,fn:el=>{

}

}

function showScene(i){
 iClear();introIdx=i;const S=SCENES[i],st=$('#iStage');

 void el.offsetWidth;el.classList.add('on');
 $('#intro').classList.toggle('board',i===6);
 $('#iSkip').style.display=(i>=1&&i<=5)?'block':'none';
 AU.state=i>=1&&i<=5?'intro':'menu';
 if(S.go)S.go();
 if(S.dur)iLater(S.dur,()=>showScene(i+1));
}
